<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>La vostra idea è già lanciata · LFG+Zest Xmas 2026</title>
<style>
@font-face{font-family:'Playfair Display';font-weight:400;font-style:normal;src:url(fonts/playfair-display-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:400;font-style:italic;src:url(fonts/playfair-display-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:500;font-style:normal;src:url(fonts/playfair-display-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:500;font-style:italic;src:url(fonts/playfair-display-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:600;font-style:italic;src:url(fonts/playfair-display-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Playfair Display';font-weight:700;font-style:italic;src:url(fonts/playfair-display-latin-700-italic.woff2) format('woff2')}
@font-face{font-family:'Mulish';font-weight:400;src:url(fonts/mulish-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Mulish';font-weight:600;src:url(fonts/mulish-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Mulish';font-weight:800;src:url(fonts/mulish-latin-800-normal.woff2) format('woff2')}
:root{
  --night-0:#051E25; --night-1:#082A33; --night-2:#0C3540; --teal:#0E6E80; --teal-3:#2E8296; --sky:#55B6E6;
  --gold:#D5B26A; --gold-2:#B0852F; --gold-hi:#EBCB86; --champagne:#F3E6C8; --berry:#B4232F; --berry-deep:#83021A; --pine:#1E5A4C;
  --text:#EEF3F2; --text-2:#B9C9CC;
  --serif:'Playfair Display',Georgia,serif; --sans:'Mulish',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;overflow:hidden}
body{width:1920px;height:1080px;position:relative;font-family:var(--sans);color:var(--text);-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--night-0)}
canvas{position:absolute;left:0;top:0;width:1920px;height:1080px;display:block}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1500px;perspective-origin:960px 540px}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:960px 540px 0}
.sheet{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:960px 540px 0;display:none}
.p3{transform-style:preserve-3d}
.abs{position:absolute}
.frame{position:absolute;left:80px;top:60px;right:80px;bottom:60px;transform:translateZ(-320px) scale(1.2133);transform-origin:880px 480px;border:1.5px solid rgba(213,194,154,.26);border-radius:30px;
  background:linear-gradient(170deg,rgba(18,66,77,.55),rgba(8,42,51,.30) 60%,rgba(5,30,37,.25));
  box-shadow:0 70px 140px -50px rgba(0,0,0,.8),inset 0 1px 0 rgba(243,230,200,.10)}
.frame::after{content:'';position:absolute;inset:14px;border:1px solid rgba(213,194,154,.10);border-radius:22px}
.eyebrow{font:800 24px/1 var(--sans);letter-spacing:.34em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.disp{font-family:var(--serif);font-weight:500;color:var(--champagne);line-height:1.05;white-space:nowrap}
.disp em,.it{font-style:italic;color:var(--gold)}
.glow{text-shadow:0 0 50px rgba(213,178,106,.35),0 4px 30px rgba(0,0,0,.45)}
.ch{display:inline-block;transform-style:preserve-3d;white-space:pre}
.center-x{left:0;width:1920px;text-align:center}
img{display:block}
/* subtitles */
#subs{position:absolute;left:0;right:0;bottom:0;height:250px;pointer-events:none;
  background:linear-gradient(to top,rgba(2,14,18,.88) 0%,rgba(2,14,18,.62) 45%,rgba(2,14,18,0) 100%)}
#subline{position:absolute;left:110px;right:110px;bottom:62px;text-align:center;font:700 58px/1.22 var(--sans);letter-spacing:.004em}
.sw{display:inline-block;white-space:pre;color:transparent;-webkit-background-clip:text;background-clip:text}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,8,10,.55) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* objects */
.card{background:linear-gradient(180deg,rgba(16,58,68,.95),rgba(8,42,51,.95));border:2px solid rgba(213,178,106,.55);border-radius:22px;
  box-shadow:0 40px 80px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(243,230,200,.15)}
.ticket{width:110px;height:66px;border-radius:6px;background:linear-gradient(160deg,#FBF4E2,#E9D9B4);border:2px dashed rgba(176,133,47,.75);
  box-shadow:0 10px 24px -8px rgba(0,0,0,.6);font:italic 600 32px/62px var(--serif);color:var(--gold-2);text-align:center}
.ticket.gold{background:linear-gradient(160deg,#F7DE9C,#C99A42);border-color:#83021A;color:#5A0612;font:800 28px/62px var(--sans);letter-spacing:.08em}
.table{border-radius:50%;border:3px solid rgba(213,178,106,.75);background:radial-gradient(circle,rgba(30,90,76,.9),rgba(12,53,64,.95));
  display:flex;align-items:center;justify-content:center;font:italic 500 70px/1 var(--serif);color:var(--champagne)}
.chair{width:34px;height:34px;border-radius:50%;border:2px solid rgba(213,194,154,.6);background:rgba(8,42,51,.9)}
.namecard{width:400px;height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.namecard .n{font:italic 500 84px/1 var(--serif);color:var(--champagne)}
.chip{display:inline-block;padding:10px 20px;border-radius:999px;border:2px solid rgba(213,194,154,.35);font:700 22px/1 var(--sans);color:var(--text-2);margin:0 8px 10px 0}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1206;box-shadow:0 0 30px rgba(213,178,106,.6)}
.field{border:2px solid rgba(213,194,154,.28);border-radius:14px;background:rgba(5,30,37,.6);padding:14px 16px;font:600 24px/1.35 var(--sans);color:var(--text)}
.flabel{font:800 15px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px}
.songcard{width:190px;height:190px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  background:linear-gradient(180deg,rgba(16,58,68,.95),rgba(8,42,51,.95));border:1.5px solid rgba(213,178,106,.4);box-shadow:0 30px 50px -24px rgba(0,0,0,.8)}
.vinyl{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,#D5B26A 0 14%,#0b1f25 15% 18%,#14323a 19% 40%,#0b1f25 41% 44%,#14323a 45% 70%,#0b1f25 71% 100%);
  box-shadow:0 0 0 2px rgba(213,178,106,.35)}
.songcard .l{font:800 15px/1 var(--sans);letter-spacing:.2em;color:var(--text-2);text-transform:uppercase}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="cam"><div id="world"></div></div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="vignette"></div>
  <div id="subs"><div id="subline"></div></div>
  <div id="fade"></div>
</div>
<script src="lyrics.js"></script>
<script src="lyrics.en.js"></script>
<script src="film.js"></script>
</body>
</html>
