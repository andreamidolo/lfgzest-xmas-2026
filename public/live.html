<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#051E25">
<meta name="robots" content="noindex, nofollow">
<title>Live control · LFG Holding Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon.svg">
<style>
  .ctl { position: relative; z-index: 1; max-width: 560px; margin: 0 auto; padding: 8px 16px 60px; }
  .ctl h1 { font-size: 30px; color: var(--champagne); margin-top: 6px; } .ctl h1 em { color: var(--gold); }
  .state { margin-top: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(213,178,106,.06); font-size: 14px; color: var(--champagne); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; } .row > * { flex: 1; }
  .fc { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: rgba(16,58,68,.6); }
  .fc.cur { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
  .fc b { font-family: var(--font-display); color: var(--champagne); font-size: 20px; font-weight: 500; display: block; }
  .fc span { color: var(--text-2); font-size: 13px; }
  .fc .sc { float: right; font-family: var(--font-display); color: var(--gold); font-size: 24px; }
  .mic { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
  .mini { flex: 1; height: 10px; border-radius: 10px; background: rgba(226,237,239,.08); overflow: hidden; } .mini i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--h-teal), var(--gold), #E8604C); }
  .big { font-family: var(--font-display); font-size: 64px; color: var(--champagne); text-align: center; margin-top: 10px; min-height: 1.1em; }
  .note { font-size: 12px; color: var(--text-3); margin-top: 8px; }
</style>
</head>
<body>
<main class="ctl">
  <nav id="nav" class="navbar" data-active="admin" aria-label="Main"></nav>
  <p class="eyebrow">Organizer · live control</p>
  <h1>The <em>Final</em> — live</h1>
  <div class="state" id="state">Loading…</div>
  <div class="row">
    <a class="btn btn-sm" href="/final?screen=1" target="_blank" rel="noopener">📺 Open big screen</a>
    <a class="btn btn-sm" href="/final" target="_blank" rel="noopener">📱 Guest view</a>
    <button class="btn btn-sm" id="reveal">…</button>
  </div>
  <div class="mic"><button class="btn btn-sm btn-gold" id="micBtn">🎙 Enable microphone</button><span class="mini"><i id="mini"></i></span></div>
  <p class="note">Keep this phone in the same spot for all three songs (music stopped while measuring). Nothing is recorded — only the score.</p>
  <div class="big" id="big"></div>
  <div id="fins"></div>
  <div class="row" style="margin-top:16px">
    <button class="btn" id="bIdle">⏹ Intro screen</button>
    <button class="btn" id="bScores">📊 Scores</button>
    <button class="btn btn-gold" id="bWinner">🏆 Winner</button>
  </div>
  <button class="btn btn-ghost btn-danger" id="bReset" style="width:100%;margin-top:10px">Reset applause scores</button>
</main>
<script src="/common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  document.querySelector('.ambient')?.remove();
  let R = null, V = null, analyser = null, buf = null, ctx = null, stream = null, busy = false, level = 0;
  const DB_MIN = -55, DB_MAX = -6;
  const toScore = (rms) => { const db = 20 * Math.log10(Math.max(rms, 1e-7)); return Math.max(0, Math.min(100, ((db - DB_MIN) / (DB_MAX - DB_MIN)) * 100)); };
  const read = () => { analyser.getFloatTimeDomainData(buf); let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return toScore(Math.sqrt(s / buf.length)); };
  const stage = (body) => api('/api/admin/stage', { method: 'PUT', body });
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  async function load() {
    try { [R, V] = await Promise.all([api('/api/stage'), api('/api/admin/v4')]); } catch (e) { if (e.status === 401) location.href = '/admin'; return; }
    render();
  }
  const labels = { idle: 'Intro screen', song: 'Playing', applause: 'Applause meter', result: 'Scores', winner: 'Winner' };
  function render() {
    const st = R.stage, f = R.finalists.find((x) => x.id === st.entryId);
    $('reveal').textContent = V.event.finalRevealed ? '🔓 Final revealed' : '🏆 Reveal the final';
    $('reveal').classList.toggle('btn-gold', !V.event.finalRevealed);
    $('state').textContent = !V.event.finalRevealed ? 'The final is hidden — reveal it to start.' : `On all screens: ${labels[st.mode] || st.mode}${f ? ' · ' + f.title : ''}`;
    $('fins').innerHTML = R.finalists.map((x, i) => `<div class="fc ${x.id === st.entryId ? 'cur' : ''}"><span class="sc">${x.applause != null ? Math.round(x.applause) + ' pts' : ''}</span>
      <b>${i + 1}. ${esc(x.title)}</b><span>by ${esc(x.name)}${x.translation ? ' · 🇺🇸 translation' : ''}${x.english ? ' · English version' : ''}</span>
      <div class="row"><button class="btn btn-sm" data-play="${x.id}">▶ Play</button><button class="btn btn-sm btn-gold" data-clap="${x.id}" ${analyser ? '' : 'disabled'}>👏 Applause</button></div></div>`).join('')
      || '<p class="note">No finalists visible yet: choose 3 finalists in Admin → Songs and reveal the final.</p>';
  }
  document.addEventListener('click', async (e) => {
    const p = e.target.closest('[data-play]'), c = e.target.closest('[data-clap]');
    if (p && !busy) { await stage({ mode: 'song', entryId: +p.dataset.play, start: true, measure: null, live: null }); toast('▶ Playing on all screens'); load(); }
    if (c && !busy) clap(+c.dataset.clap);
  });
  $('reveal').onclick = async () => { if (!V) return; await api('/api/admin/event', { method: 'PATCH', body: { finalRevealed: !V.event.finalRevealed } }); load(); };
  $('bIdle').onclick = async () => { await stage({ mode: 'idle', entryId: null, start: null, measure: null, live: null, winners: null }); load(); };
  $('bScores').onclick = async () => { await stage({ mode: 'result', measure: null, winners: null }); load(); };
  $('bWinner').onclick = async () => {
    await load(); const done = R.finalists.filter((x) => x.applause != null); if (!done.length) return toast('Measure at least one song first', true);
    const best = Math.max(...done.map((x) => x.applause)); const win = done.filter((x) => best - x.applause < 0.5).map((x) => x.id);
    await stage({ mode: 'winner', winners: win, measure: null }); toast('🏆 Winner on all screens'); load();
  };
  $('bReset').onclick = async () => { if (!confirm('Reset all applause scores?')) return; await api('/api/admin/entries-applause', { method: 'DELETE' }); await stage({ mode: 'idle', winners: null, live: null, measure: null }); load(); };

  $('micBtn').onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); await ctx.resume();
      analyser = ctx.createAnalyser(); analyser.fftSize = 2048; buf = new Float32Array(analyser.fftSize); ctx.createMediaStreamSource(stream).connect(analyser);
      $('micBtn').textContent = '🎙 Mic on'; $('micBtn').classList.remove('btn-gold'); render();
      (function amb() { if (!busy) { level = level * 0.7 + read() * 0.3; $('mini').style.width = level + '%'; } requestAnimationFrame(amb); })();
    } catch (e) { toast('Microphone not available: ' + (e.message || e.name), true); }
  };

  async function clap(id) {
    const f = R.finalists.find((x) => x.id === id);
    if (f.applause != null && !confirm(`${f.title} already has ${Math.round(f.applause)} pts. Measure again?`)) return;
    busy = true;
    try {
      await stage({ mode: 'applause', entryId: id, measure: { phase: 'countdown' }, live: { level: 0, avg: 0 } });
      for (let n = 3; n > 0; n--) { $('big').textContent = n; await sleep(1000); }
      await stage({ measure: { phase: 'measuring' } });
      $('big').textContent = '👏';
      let sum = 0, frames = 0, peak = 0, smooth = 0, lastSend = 0; const t0 = performance.now();
      await new Promise((done) => {
        (function fr() {
          const el = (performance.now() - t0) / 1000, v = read(); sum += v; frames++; smooth = smooth * 0.6 + v * 0.4; peak = Math.max(peak, smooth);
          $('mini').style.width = smooth + '%'; const avg = sum / frames; $('big').textContent = Math.round(avg);
          if (performance.now() - lastSend > 400) { lastSend = performance.now(); stage({ live: { level: smooth, avg, t: el } }).catch(() => {}); }
          if (el < 7) requestAnimationFrame(fr); else done();
        })();
      });
      const score = sum / Math.max(frames, 1);
      await api(`/api/admin/entries/${id}/applause`, { method: 'PUT', body: { score, peak } });
      await stage({ measure: { phase: 'done' }, live: { level: score, avg: score, t: 7 } });
      $('big').textContent = Math.round(score) + ' pts'; toast(`${f.title}: ${Math.round(score)} pts`);
    } catch (e) { toast('Error: ' + e.message, true); }
    busy = false; load();
  }
  load(); setInterval(() => { if (!busy) load(); }, 3000);
})();
</script>
</body>
</html>
