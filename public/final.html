<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#051E25">
<meta name="robots" content="noindex, nofollow">
<title>The Final · LFG+Zest Christmas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon.svg">
<style>
  body.screen .navbar { display: none; }
  .stagewrap { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 8px 16px 60px; text-align: center; }
  body.screen .stagewrap { padding-top: 3vh; }
  .cover { position: fixed; inset: -10%; z-index: 0; background-size: cover; background-position: center; filter: blur(60px) saturate(1.2); opacity: .25; transform: scale(1.1); transition: background-image 1s; }
  .logos { display: flex; justify-content: center; gap: 14px; margin-top: 6px; } .logos img { height: clamp(32px, 5vh, 56px); }
  h1.big { font-size: clamp(34px, 6vw, 96px); color: var(--champagne); line-height: 1.05; margin-top: 1.2vh; } h1.big em { color: var(--gold); }
  .lead { color: var(--text-2); font-size: clamp(15px, 1.4vw, 24px); margin: 1vh auto 0; max-width: 46em; }
  .view { display: none; } .view.on { display: block; animation: fadeIn .5s ease both; }
  /* idle */
  .fins { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 380px)); justify-content: center; gap: 16px; margin-top: 3vh; }
  .fin { border: 1px solid var(--gold); border-radius: 14px; overflow: hidden; background: linear-gradient(180deg, rgba(16,58,68,.8), rgba(8,42,51,.8)); }
  .fin .im { aspect-ratio: 16/9; background: #0C3540 center/cover; }
  .fin .tx { padding: 12px 14px 16px; } .fin b { display: block; font-family: var(--font-display); font-weight: 500; color: var(--champagne); font-size: clamp(20px, 1.8vw, 30px); line-height: 1.15; }
  .fin span { color: var(--text-2); font-size: 14px; } .fin .sc { font-family: var(--font-display); color: var(--gold); font-size: 28px; margin-top: 6px; }
  .how { margin: 4vh auto 0; max-width: 1000px; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; text-align: left; }
  .how div { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: rgba(213,178,106,.05); }
  .how b { display: block; font-family: var(--font-display); color: var(--gold); font-size: 30px; line-height: 1; }
  .how p { margin: 6px 0 0; color: var(--text); font-size: clamp(14px, 1.15vw, 18px); }
  /* song */
  .now { color: var(--gold); font-family: var(--font-display); font-style: italic; font-size: clamp(18px, 2vw, 34px); }
  .stitle { font-family: var(--font-display); color: var(--champagne); font-size: clamp(28px, 4vw, 64px); line-height: 1.1; margin-top: .5vh; }
  .lyr { margin-top: 5vh; min-height: 40vh; display: flex; flex-direction: column; justify-content: center; }
  .line { font-family: var(--font-display); line-height: 1.25; transition: all .3s; }
  .line.prev { font-size: clamp(16px, 2vw, 34px); opacity: .3; color: var(--text-2); min-height: 1.3em; }
  .line.cur { font-size: clamp(26px, 4.6vw, 80px); color: rgba(243,230,200,.35); margin: 2vh 0 .6vh; min-height: 1.3em; font-weight: 500; }
  .line.next { font-size: clamp(16px, 2.2vw, 38px); opacity: .5; color: var(--text-2); min-height: 1.3em; margin-top: 2vh; }
  .tr { font-family: var(--font-body); font-style: italic; color: var(--h-sky); font-size: clamp(15px, 1.9vw, 32px); min-height: 1.4em; opacity: .95; }
  .wd { white-space: nowrap; }
  .w { position: relative; display: inline-block; white-space: pre; }
  .w::after { content: attr(data-t); position: absolute; left: 0; top: 0; color: var(--gold); text-shadow: 0 0 22px rgba(213,178,106,.55); width: var(--p, 0%); overflow: hidden; white-space: pre; }
  .w.done { color: var(--champagne); } .w.done::after { width: 100%; color: var(--champagne); text-shadow: none; }
  .bigmsg { font-family: var(--font-display); font-size: clamp(34px, 6vw, 100px); color: var(--champagne); line-height: 1.1; }
  .bigmsg em { color: var(--gold); }
  .prog { height: 4px; border-radius: 4px; background: rgba(226,237,239,.08); margin: 4vh auto 0; max-width: 900px; overflow: hidden; } .prog i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--h-teal), var(--gold)); }
  /* applause */
  .count { font-family: var(--font-display); font-size: clamp(120px, 24vw, 380px); line-height: 1; color: var(--champagne); text-shadow: 0 0 60px rgba(213,178,106,.6); }
  .meter { max-width: 1100px; margin: 4vh auto 0; }
  .mbar { position: relative; height: clamp(46px, 9vh, 96px); border-radius: 999px; background: rgba(226,237,239,.07); border: 1px solid var(--line); overflow: hidden; }
  .mbar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 999px; background: linear-gradient(90deg, #0E6E80 0%, #2E8296 35%, #D5B26A 70%, #E8604C 100%); background-size: 1100px 100%; transition: width .35s ease-out; box-shadow: 0 0 40px rgba(213,178,106,.5); }
  .mbar b { position: absolute; top: -6px; bottom: -6px; width: 3px; background: var(--champagne); left: 0; transition: left .35s; }
  .mnum { margin-top: 2vh; font-family: var(--font-display); color: var(--champagne); font-size: clamp(48px, 8vw, 130px); line-height: 1; } .mnum small { font-size: .35em; color: var(--text-3); font-family: var(--font-body); letter-spacing: .1em; }
  /* scores */
  .board { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 420px)); justify-content: center; gap: 2vw; margin-top: 4vh; align-items: end; }
  .col { border: 1px solid var(--line); border-radius: 16px; padding: 2vh 1.2vw; background: linear-gradient(180deg, rgba(16,58,68,.7), rgba(8,42,51,.7)); position: relative; transition: transform .6s, box-shadow .6s; }
  .col h3 { font-size: clamp(18px, 2vw, 34px); color: var(--champagne); font-style: italic; line-height: 1.15; } .col .by { color: var(--text-2); font-size: 14px; }
  .vbar { height: clamp(120px, 26vh, 320px); margin: 2vh auto 1.4vh; width: 46%; border-radius: 12px; background: rgba(226,237,239,.06); position: relative; overflow: hidden; border: 1px solid var(--line-soft); }
  .vbar i { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, #0E6E80, #D5B26A); transition: height 1.6s cubic-bezier(.2,.8,.2,1); }
  .pts { font-family: var(--font-display); font-size: clamp(30px, 3.6vw, 64px); color: var(--champagne); line-height: 1; } .pts small { font-size: .4em; color: var(--text-3); font-family: var(--font-body); }
  .col.win { transform: translateY(-14px) scale(1.04); border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 30px 80px -20px rgba(213,178,106,.7); }
  .col .crown { position: absolute; top: -34px; left: 50%; transform: translateX(-50%) scale(0); font-size: 52px; transition: transform .6s cubic-bezier(.3,1.6,.5,1); } .col.win .crown { transform: translateX(-50%) scale(1); }
  .soundgate { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; background: rgba(5,30,37,.92); }
  body.screen.needsound .soundgate { display: flex; }
  canvas#confetti { position: fixed; inset: 0; z-index: 40; pointer-events: none; }
  .tiny2 { color: var(--text-3); font-size: 12px; margin-top: 3vh; }
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div id="cover" class="cover"></div>
<div class="soundgate"><button class="btn btn-gold btn-big" id="soundBtn" style="max-width:520px">🔊 Click to enable sound on the big screen</button></div>
<main class="stagewrap">
  <nav id="nav" class="navbar" data-active="karaoke" aria-label="Main"></nav>
  <div class="logos"><img src="/brand/lfg-zest-white.png" alt="LFG+Zest"><img src="/brand/lfa-white.png" alt="LFA"></div>

  <section class="view" id="vWait">
    <h1 class="big">The <em>Final</em></h1>
    <p class="lead">The three finalist songs will be revealed soon. Stay close to the big screen!</p>
    <div class="how" id="how1"></div>
  </section>

  <section class="view" id="vIdle">
    <p class="eyebrow" style="margin-top:2vh">LFG+Zest Christmas Music Battle</p>
    <h1 class="big">The <em>Final</em></h1>
    <p class="lead">Three songs, one winner: the loudest applause of the night.</p>
    <div class="fins" id="fins"></div>
    <div class="how" id="how2"></div>
  </section>

  <section class="view" id="vSong">
    <div class="now" id="sNow"></div>
    <div class="stitle" id="sTitle"></div>
    <div class="lyr" id="lyr">
      <div class="line prev" id="lPrev"></div>
      <div class="line cur" id="lCur"></div>
      <div class="tr" id="lTr"></div>
      <div class="line next" id="lNext"></div>
    </div>
    <div class="prog"><i id="sProg"></i></div>
  </section>

  <section class="view" id="vApplause">
    <div class="now" id="aNow"></div>
    <div class="stitle" id="aTitle"></div>
    <div class="count" id="aCount"></div>
    <div class="meter" id="aMeter"><div class="mbar"><i id="aBar"></i><b id="aAvg"></b></div>
      <div class="mnum"><span id="aNum">0</span> <small>PTS</small></div></div>
  </section>

  <section class="view" id="vBoard">
    <p class="eyebrow" style="margin-top:2vh">The Applause Meter</p>
    <h1 class="big" id="bTitle">The <em>scores</em></h1>
    <div class="board" id="board"></div>
  </section>
  <p class="tiny2" id="foot"></p>
</main>
<audio id="audio" preload="auto"></audio>
<script src="/common.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const screen = /[?&]screen=1/.test(location.search);
  if (screen) { document.body.classList.add('screen', 'needsound'); document.querySelector('.ambient')?.remove(); }
  const audio = $('audio');
  let off = 0, S = null, FIN = [], finSig = '', lastV = -1, lines = [], curId = null, prevMode = '', soundOk = false;
  const now = () => Date.now() + off;
  const how = `<div><b>1</b><p>Each finalist song plays on the big screen — sing along, the lyrics (and the English translation) follow the music.</p></div>
    <div><b>2</b><p>When the song ends: <b style="display:inline;font-size:inherit;color:var(--champagne)">3 · 2 · 1</b>, then 7 seconds of applause. Clap, cheer, stomp!</p></div>
    <div><b>3</b><p>The Applause Meter measures the <i>average</i> volume over the 7 seconds (0–100). Same microphone, same spot for every song.</p></div>
    <div><b>🏆</b><p>The loudest applause wins a 100 CHF voucher.</p></div>`;
  $('how1').innerHTML = how; $('how2').innerHTML = how;
  $('soundBtn').onclick = () => { soundOk = true; audio.muted = false; audio.play().then(() => audio.pause()).catch(() => {}); document.body.classList.remove('needsound'); };

  function show(v) { ['vWait', 'vIdle', 'vSong', 'vApplause', 'vBoard'].forEach((x) => $(x).classList.toggle('on', x === v)); }
  const fin = (id) => FIN.find((f) => f.id === id);
  const strip = (s) => s.split('\n').map((l) => l.trim()).filter((l) => l && !/^\[.*\]$/.test(l));

  function buildLines(f) {
    const words = f.clip && f.clip.alignment; let out = [];
    if (words && words.length) {
      let cur = [];
      for (const w of words) { const parts = w.w.split('\n'); parts.forEach((p, i) => { if (i > 0 && cur.length) { out.push(cur); cur = []; } if (p) cur.push({ t: p.replace(/^\s+/, cur.length ? ' ' : ''), s: w.s, e: Math.max(w.e, w.s + 0.05) }); }); }
      if (cur.length) out.push(cur);
    } else {
      const ls = strip(f.lyrics || ''), dur = (f.clip && f.clip.duration) || 120, per = dur / Math.max(ls.length, 1);
      out = ls.map((l, i) => l.split(/(\s+)/).filter(Boolean).reduce((acc, tok) => { if (/^\s+$/.test(tok) && acc.length) acc[acc.length - 1].t += tok; else acc.push({ t: tok }); return acc; }, [])
        .map((w, j, arr) => ({ t: w.t, s: i * per + (j / arr.length) * per * 0.9, e: i * per + ((j + 1) / arr.length) * per * 0.9 })));
    }
    return out.filter((l) => l.length);
  }
  function drawLine(el, l, tm, active) {
    if (!l) { el.innerHTML = '&nbsp;'; return; }
    if (!active) { el.textContent = l.map((w) => w.t).join(''); return; }
    // keep syllables of one word together (no line break inside a word)
    const groups = []; l.forEach((w) => { if (!groups.length || /^\s/.test(w.t)) groups.push([w]); else groups[groups.length - 1].push(w); });
    el.innerHTML = groups.map((g) => '<span class="wd">' + g.map((w) => { const p = tm <= w.s ? 0 : tm >= w.e ? 100 : ((tm - w.s) / (w.e - w.s)) * 100; return `<span class="w ${p >= 100 ? 'done' : ''}" data-t="${esc(w.t)}" style="--p:${p}%">${esc(w.t)}</span>`; }).join('') + '</span>').join('');
  }
  function renderIdle() {
    $('fins').innerHTML = FIN.map((f) => `<div class="fin"><div class="im" style="background-image:url('${esc((f.clip && f.clip.image || '').replace('image_', 'image_large_'))}')"></div>
      <div class="tx"><b>${esc(f.title)}</b><span>by ${esc(f.name)}</span>${f.applause != null ? `<div class="sc">${Math.round(f.applause)} pts</div>` : ''}</div></div>`).join('') || '<p class="lead">Finalists coming soon…</p>';
  }
  function renderBoard(win) {
    const done = FIN.filter((f) => f.applause != null);
    $('bTitle').innerHTML = win && win.length ? (win.length > 1 ? "It's a <em>tie!</em>" : 'And the winner <em>is…</em>') : 'The <em>scores</em>';
    $('board').innerHTML = FIN.map((f) => `<div class="col ${win && win.includes(f.id) ? 'win' : ''}"><div class="crown">🏆</div><h3>${esc(f.title)}</h3><div class="by">by ${esc(f.name)}</div>
      <div class="vbar"><i data-h="${f.applause || 0}"></i></div><div class="pts">${f.applause != null ? Math.round(f.applause) : '–'} <small>PTS</small></div></div>`).join('');
    requestAnimationFrame(() => setTimeout(() => $('board').querySelectorAll('.vbar i').forEach((i) => (i.style.height = i.dataset.h + '%')), 60));
    if (win && win.length) confetti();
    $('foot').textContent = done.length < FIN.length ? `${done.length} of ${FIN.length} songs measured` : '';
  }

  async function loadFull() { const r = await api('/api/stage'); off = r.now - Date.now(); FIN = r.finalists; finSig = JSON.stringify(FIN.map((f) => [f.id, f.applause, f.clip && f.clip.id, !!(f.translation)])); return r; }
  async function tick() {
    let r; try { r = await api('/api/stage/state'); } catch (e) { return; }
    off = off * 0.7 + (r.now - Date.now()) * 0.3;
    if (!r.revealed) { S = null; show('vWait'); return; }
    const st = r.stage;
    if (!FIN.length || st.v !== lastV) { try { await loadFull(); } catch (e) {} }
    lastV = st.v; S = st;
    const f = fin(st.entryId);
    if (f && f.clip && f.clip.image) $('cover').style.backgroundImage = `url("${f.clip.image.replace('image_', 'image_large_')}")`;
    if (st.mode === 'song' && f) {
      if (curId !== f.id) { curId = f.id; lines = buildLines(f); }
      $('sNow').textContent = `Now playing · by ${f.name}`; $('sTitle').textContent = f.title; show('vSong');
    } else if (st.mode === 'applause' && f) {
      $('aNow').textContent = `Applause for · ${f.name}`; $('aTitle').textContent = f.title; show('vApplause');
    } else if (st.mode === 'result' || st.mode === 'winner') { if (prevMode !== st.mode || st.v !== renderBoard._v) { renderBoard(st.mode === 'winner' ? st.winners || [] : null); renderBoard._v = st.v; } show('vBoard'); }
    else { renderIdle(); show('vIdle'); }
    if (st.mode !== 'song' && screen && !audio.paused) audio.pause();
    prevMode = st.mode;
  }
  // smooth per-frame rendering for the song and the meter
  function frame() {
    if (S && S.mode === 'song') {
      const f = fin(S.entryId);
      if (f && S.startedAt) {
        const tm = (now() - S.startedAt) / 1000, dur = (f.clip && f.clip.duration) || 120;
        if (screen && soundOk && f.clip) {
          if (audio.dataset.id !== f.clip.id) { audio.src = f.clip.audioUrl; audio.dataset.id = f.clip.id; }
          if (tm >= 0 && tm < dur) { if (audio.paused) { audio.currentTime = tm; audio.play().catch(() => {}); } else if (Math.abs(audio.currentTime - tm) > 0.5) audio.currentTime = tm; }
        }
        $('sProg').style.width = Math.max(0, Math.min(100, (tm / dur) * 100)) + '%';
        const first = lines[0] ? lines[0][0].s : 0, last = lines.length ? lines[lines.length - 1].slice(-1)[0].e : dur;
        if (tm < 0) { $('lCur').innerHTML = `<span class="bigmsg">${Math.ceil(-tm)}</span>`; $('lPrev').innerHTML = $('lNext').innerHTML = $('lTr').innerHTML = '&nbsp;'; }
        else if (tm > last + 2) { $('lPrev').innerHTML = '&nbsp;'; $('lCur').innerHTML = '<span class="bigmsg">👏 Get ready <em>to applaud!</em></span>'; $('lTr').innerHTML = $('lNext').innerHTML = '&nbsp;'; }
        else if (tm < first - 1) { $('lPrev').innerHTML = '&nbsp;'; $('lCur').innerHTML = '<span style="opacity:.6">♪ ♪ ♪</span>'; drawLine($('lNext'), lines[0], tm, false); $('lTr').textContent = f.translation ? f.translation[0] || '' : ''; }
        else {
          let i = lines.findIndex((l) => tm < l[l.length - 1].e + 0.35); if (i < 0) i = lines.length - 1;
          drawLine($('lPrev'), lines[i - 1], tm, false); drawLine($('lCur'), lines[i], tm, true); drawLine($('lNext'), lines[i + 1], tm, false);
          $('lTr').textContent = f.translation ? f.translation[i] || '' : '';
        }
      }
    }
    if (S && S.mode === 'applause') {
      const m = S.measure || {}, lv = S.live || { level: 0, avg: 0 };
      const since = (now() - (m.at || 0)) / 1000;
      if (m.phase === 'countdown') { $('aCount').textContent = Math.max(1, 3 - Math.floor(since)); $('aMeter').style.opacity = .35; }
      else if (m.phase === 'measuring') { $('aCount').textContent = '👏'; $('aMeter').style.opacity = 1; }
      else if (m.phase === 'done') { $('aCount').textContent = ''; $('aMeter').style.opacity = 1; }
      else { $('aCount').textContent = '👏'; $('aMeter').style.opacity = .35; }
      $('aBar').style.width = (m.phase === 'done' ? lv.avg : lv.level) + '%'; $('aAvg').style.left = lv.avg + '%'; $('aNum').textContent = Math.round(lv.avg);
    }
    requestAnimationFrame(frame);
  }
  function loop() { tick().finally(() => setTimeout(loop, S && (S.mode === 'song' || S.mode === 'applause') ? (screen ? 600 : 1000) : 2000)); }
  function confetti() {
    const c = $('confetti'), g = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
    const cols = ['#D5B26A', '#F3E6C8', '#B4232F', '#2E8296', '#ffffff'];
    const ps = Array.from({ length: 200 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.6, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: 4 + Math.random() * 6, a: Math.random() * 6, col: cols[Math.floor(Math.random() * cols.length)] }));
    const t0 = performance.now();
    (function f() { g.clearRect(0, 0, c.width, c.height); ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.a += 0.1; g.save(); g.translate(p.x, p.y); g.rotate(p.a); g.fillStyle = p.col; g.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); g.restore(); });
      if (performance.now() - t0 < 7000) requestAnimationFrame(f); else g.clearRect(0, 0, c.width, c.height); })();
  }
  show('vWait'); loop(); frame();
})();
</script>
</body>
</html>
