<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082A33">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon.svg">
<title>Table QR Codes · LFG+Zest Christmas 2026</title>
<meta name="robots" content="noindex, nofollow">
<style>
  .bar { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; max-width: 900px; margin: 0 auto; padding: 20px 16px; }
  .sheet { position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; max-width: 900px; margin: 0 auto; padding: 0 16px 40px; }
  .pc { position: relative; text-align: center; padding: 26px 22px; border: 1px solid var(--gold); outline: 1px solid rgba(213,178,106,.35); outline-offset: -8px;
        background: linear-gradient(180deg, #0C3540, #051E25); border-radius: 4px; break-inside: avoid; page-break-inside: avoid; }
  .pc .logos { display: flex; justify-content: center; gap: 12px; } .pc .logos img { height: 46px; }
  .pc .eyebrow { margin-top: 14px; } .pc h2 { font-style: italic; color: var(--champagne); font-size: 30px; margin-top: 4px; }
  .pc .q { background: #fff; padding: 10px; border-radius: 10px; margin: 14px auto; width: 78%; } .pc .q img { width: 100%; display: block; }
  .pc .tn { font-family: var(--font-display); font-size: 44px; color: var(--champagne); line-height: 1; }
  .pc .nm { font-family: var(--font-display); font-style: italic; color: var(--gold); font-size: 18px; margin-top: 4px; }
  .pc .cta { color: var(--text-2); font-size: 13px; margin-top: 8px; }
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { background: #fff !important; } body::before { display: none; } .bar, .ambient { display: none !important; }
    .sheet { grid-template-columns: 1fr 1fr; gap: 10mm; padding: 0; max-width: none; }
    .pc { height: 128mm; display: flex; flex-direction: column; justify-content: center; }
  }
</style>
</head>
<body>
<div class="bar">
  <div><p class="eyebrow">Organizer</p><h1 style="font-size:26px;color:var(--champagne)">Table QR codes</h1><p class="tiny">Print, or choose “Save as PDF” in the print dialog. 4 cards per A4 page.</p></div>
  <div style="display:flex;gap:8px"><a class="btn btn-sm" href="/admin#qr">← Dashboard</a><button class="btn btn-gold" onclick="window.print()">Print / Save PDF</button></div>
</div>
<div id="warn" class="wrap hidden" style="padding-top:0"><div class="msg info" id="warnMsg"></div></div>
<div id="sheet" class="sheet"><div class="spinner"></div></div>
<script src="/common.js"></script>
<script>
(async () => {
  try {
    const S = await api('/api/admin/state');
    if (/localhost|127\.0\.0\.1|192\.168\./.test(S.baseUrl)) { document.getElementById('warn').classList.remove('hidden'); document.getElementById('warnMsg').innerHTML = 'These QR codes point to <b>' + esc(S.baseUrl) + '</b>, a development address. Print them from the published app.'; }
    document.getElementById('sheet').innerHTML = S.tables.map((t) => '<div class="pc"><div class="logos"><img src="/brand/lfg-zest-white.png" alt="LFG+Zest"><img src="/brand/lfa-white.png" alt="LFA"></div>' +
      '<p class="eyebrow">Christmas Dinner 2026</p><h2>Music Battle</h2>' +
      '<div class="q"><img src="/api/admin/qr/' + t.id + '.png?v=' + t.token.slice(0, 6) + '" alt="QR Table ' + t.number + '"></div>' +
      '<div class="tn">Table ' + t.number + '</div>' + (t.name ? '<div class="nm">' + esc(t.name) + '</div>' : '') +
      '<div class="cta">Scan to submit your table’s song</div></div>').join('');
  } catch (e) { if (e.status === 401) location.href = '/admin'; else document.getElementById('sheet').innerHTML = '<p class="msg err">' + esc(e.message) + '</p>'; }
})();
</script>
</body>
</html>
