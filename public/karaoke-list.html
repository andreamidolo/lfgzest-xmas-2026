<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#082A33">
<meta name="robots" content="noindex, nofollow">
<title>Christmas Karaoke · LFG Holding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Mulish:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" href="/brand/favicon.svg">
<style>
  .wrap.wide { max-width: 1180px; }
  .songs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; margin-top: 10px; }
  .kcard { background: linear-gradient(180deg, rgba(16, 58, 68, .78), rgba(8, 42, 51, .78)); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .kcover { aspect-ratio: 16 / 9; background: #0C3540 center / cover no-repeat; position: relative; }
  .kcover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(5, 30, 37, .95)); }
  .kcover .team { position: absolute; left: 16px; bottom: 12px; z-index: 1; font-family: var(--font-display); font-style: italic; color: var(--gold); font-size: 18px; }
  .kbody { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .kbody h2 { font-size: 26px; color: var(--champagne); line-height: 1.15; }
  .kbody .concept { color: var(--text-2); margin: 0; font-size: 15px; }
  .kbody audio { width: 100%; }
  .kbody details summary { cursor: pointer; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-weight: 800; }
  .kbody pre { white-space: pre-wrap; font: inherit; font-size: 16px; line-height: 1.6; margin: 10px 0 0; color: var(--text); }
  .kbody .expl { font-size: 14px; color: var(--text-2); }
  .empty { text-align: center; padding: 40px 16px; }
  .finhead { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .finhead .sect { margin: 0; }
  .teaser { grid-column: 1 / -1; text-align: center; border-color: var(--gold); }
  .teaser h2 { color: var(--champagne); font-size: 30px; margin-top: 6px; font-style: italic; }
  .sect { grid-column: 1 / -1; color: var(--champagne); font-size: 28px; margin-top: 10px; }
  .kfin { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 20px 60px -20px rgba(213,178,106,.5); }
</style>
</head>
<body>
<main class="wrap wide">
  <nav id="nav" class="navbar" data-active="karaoke" aria-label="Main"></nav>
  <div class="holdbar"><img src="/brand/lfg-holding-white.png" alt="LFG Holding"></div>
  <div class="brandbar"><img src="/brand/lfg-zest-white.png" alt="LFG+Zest"><span class="sep"></span><img src="/brand/lfa-white.png" alt="LFA"></div>
  <section class="hero">
    <div data-garland></div>
    <p class="eyebrow" style="margin-top:12px">LFG Holding Christmas Dinner</p>
    <h1>Christmas<br><em>Karaoke</em></h1>
    <p class="sub">Everyone wrote a song. Here they are &mdash; and the three finalists of the night.</p>
  </section>
  <div id="list" class="songs-grid"><div class="spinner"></div></div>
</main>
<footer class="foot"><div class="logos"><img class="holding-logo" src="/brand/lfg-holding-white.png" alt="LFG Holding SA"></div>Ristorante Arbostora · Morcote</footer>
<script src="/common.js"></script>
<script>
(function () {
  let sig = '', isAdmin = false;
  fetch('/api/admin/me', { credentials: 'same-origin' }).then((r) => r.json()).then((d) => { isAdmin = !!d.admin; sig = ''; load(); }).catch(() => {});
  async function load() {
    if ([...document.querySelectorAll('audio')].some((a) => !a.paused)) return; // never interrupt playback
    let r; try { r = await api('/api/karaoke'); } catch (e) { return; }
    const s = JSON.stringify([r.final, r.songs.map((x) => [x.id, x.title, x.clip.id, x.finalist])]); if (s === sig) return; sig = s;
    const el = document.getElementById('list');
    if (!r.songs.length) { el.innerHTML = '<div class="card empty" style="grid-column:1/-1"><div class="star" style="font-size:40px;color:var(--gold)">✦</div><h2 style="color:var(--champagne);margin-top:8px">The songs are in the studio</h2><p class="muted">They will appear here as soon as they are ready. Stay tuned!</p></div>'; return; }
    const card = (x) => `<article class="kcard ${x.finalist ? 'kfin' : ''}">
      <div class="kcover" style="background-image:url('${esc((x.clip.image || '').replace('image_', 'image_large_'))}')"><span class="team">${x.finalist ? '🏆 Finalist · ' : ''}${esc(x.name)}</span></div>
      <div class="kbody">
        <h2>${esc(x.title)}</h2>
        <audio controls preload="none" src="${esc(x.clip.audioUrl)}"></audio>
        ${x.english ? `<div class="tiny" style="margin-top:-4px">🇺🇸 English version</div><audio controls preload="none" src="${esc(x.english.audioUrl || ('https://cdn1.suno.ai/' + x.english.id + '.mp4'))}"></audio>` : ''}
        <a class="btn ${x.finalist ? 'btn-gold' : ''}" href="/karaoke/${x.id}">▶ Sing along (big screen)</a>
        <details><summary>Lyrics</summary><pre>${esc(x.lyrics.replace(/^\s*\[[^\]]*\]\s*$/gm, '').replace(/\n{3,}/g, '\n\n').trim())}</pre></details>
        ${x.translation ? `<details><summary>🇺🇸 English translation</summary><pre>${esc(x.translation.join('\n'))}</pre></details>` : ''}
      </div></article>`;
    const fin = r.songs.filter((x) => x.finalist), rest = r.songs.filter((x) => !x.finalist);
    let html = '';
    if (r.final.revealed && fin.length) html += `<div class="finhead"><h2 class="sect">🏆 The final</h2><span style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-gold" href="/final">📺 The final — live</a>${isAdmin ? '<a class="btn" href="/admin/live">🎛 Live control</a>' : ''}</span></div>${fin.map(card).join('')}`;
    else if (r.final.pending) html += `<div class="card teaser"><div class="star" style="font-size:34px;color:var(--gold)">✦</div><h2>The final will be revealed soon…</h2><p class="muted">Three songs will compete for the loudest applause of the night.</p></div>`;
    if (rest.length) html += (html ? '<h2 class="sect">All the songs</h2>' : '') + rest.map(card).join('');
    el.innerHTML = html;
  }
  load(); setInterval(() => { if (!document.hidden) load(); }, 15000);
})();
</script>
</body>
</html>
